<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1800" viewBox="0 0 1200 1800">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="55%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.12)"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend mode="overlay" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1800" fill="url(#g1)" rx="24"/>
  <rect width="1200" height="1800" fill="url(#g2)" rx="24" />

  <!-- Emblem circle -->
  <g transform="translate(600,520)">
    <circle r="260" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <g transform="scale(1)">
      <path d="M-120 0 C -80 -60, 80 -60, 120 0 C 80 60, -80 60, -120 0 Z" fill="rgba(0,0,0,0.08)"/>
      <path d="M0 -140 L20 -60 L100 -40 L40 4 L60 80 L0 36 L-60 80 L-40 4 L-100 -40 L-20 -60 Z" fill="url(#g1)" opacity="0.95"/>
    </g>
  </g>

  <!-- Title block -->
  <g transform="translate(120,980)">
    <text x="0" y="0" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="56" fill="#fff" opacity="0.96">Capítulo 1</text>
    <text x="0" y="70" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="44" fill="#fff">O Marcado</text>

    <rect x="0" y="110" width="420" height="2" fill="rgba(255,255,255,0.18)" rx="1"/>

    <text x="0" y="170" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-weight="600" font-size="18" fill="rgba(255,255,255,0.9)">por Eldoria</text>

    <text x="0" y="220" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="14" fill="rgba(255,255,255,0.85)">Fantasia Épica • 2024</text>
  </g>

  <!-- Footer decoration -->
  <g transform="translate(120,1640)">
    <rect x="0" y="-10" width="960" height="1" fill="rgba(255,255,255,0.08)"/>
    <text x="0" y="40" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial" font-size="12" fill="rgba(255,255,255,0.75)">ViperBook — Edição de Leitura</text>
  </g>

</svg>
